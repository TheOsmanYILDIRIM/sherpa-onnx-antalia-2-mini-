plugins { id 'com.android.application' }

def llamaCppDir = project.findProperty('llamaCppDir') ?: System.getenv('LLAMA_CPP_DIR')
if (!llamaCppDir) {
    llamaCppDir = new File(rootProject.projectDir, 'llama.cpp').absolutePath
}

android {
    namespace 'com.osman.zonos3tts'
    compileSdk 35
    ndkVersion '28.0.13004108'

    defaultConfig {
        applicationId 'com.osman.zonos3tts'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-q2-external'
        ndk { abiFilters 'arm64-v8a' }

        externalNativeBuild {
            cmake {
                arguments "-DLLAMA_CPP_DIR=${llamaCppDir}",
                          "-DCMAKE_BUILD_TYPE=Release",
                          "-DBUILD_SHARED_LIBS=OFF",
                          "-DLLAMA_BUILD_COMMON=ON",
                          "-DLLAMA_BUILD_MTMD=ON",
                          "-DLLAMA_BUILD_TOOLS=OFF",
                          "-DLLAMA_BUILD_EXAMPLES=OFF",
                          "-DLLAMA_BUILD_SERVER=OFF",
                          "-DLLAMA_BUILD_APP=OFF",
                          "-DLLAMA_OPENSSL=OFF",
                          "-DLLAMA_SUBPROCESS=OFF",
                          "-DMTMD_VIDEO=OFF",
                          "-DGGML_NATIVE=OFF",
                          "-DGGML_BACKEND_DL=OFF",
                          "-DGGML_CPU_KLEIDIAI=ON",
                          "-DGGML_OPENMP=OFF",
                          "-DGGML_LLAMAFILE=OFF"
                cppFlags "-std=c++17 -O3"
            }
        }
    }

    buildTypes {
        debug { minifyEnabled false }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources { excludes += ['/META-INF/{AL2.0,LGPL2.1}', '/META-INF/DEPENDENCIES'] }
        jniLibs { useLegacyPackaging = true }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
