plugins { id 'com.android.application' }

android {
    namespace 'com.osman.antalia.tts'
    compileSdk 35

    defaultConfig {
        applicationId 'com.osman.antalia.tts'
        minSdk 26
        targetSdk 35
        versionCode 10101
        versionName '1.0.1-antalia-arm64'
        ndk { abiFilters 'arm64-v8a' }
    }

    buildTypes {
        debug {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        resources { excludes += ['/META-INF/{AL2.0,LGPL2.1}', '/META-INF/DEPENDENCIES'] }
        // Compress the 19 MB ONNX Runtime library in the APK; Android extracts it on install.
        jniLibs { useLegacyPackaging = true }
    }
}
dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.21.0'
}
