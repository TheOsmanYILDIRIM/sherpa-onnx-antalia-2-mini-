name: ZONOS3 Mini Q2 external model ZIPs

on:
  push:
    branches:
      - experiment/zonos3-mini-android-q2-20261121
    paths:
      - .github/workflows/zonos3-q2-model-package.yml
      - android/Zonos3MiniTts/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Build pinned llama.cpp quantizer and TTS
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp "$RUNNER_TEMP/llama.cpp"
          git -C "$RUNNER_TEMP/llama.cpp" checkout e6d624b9a4b95c6b52f5ca384d70b75581f9821a
          cmake -S "$RUNNER_TEMP/llama.cpp" -B "$RUNNER_TEMP/llama-build" -DCMAKE_BUILD_TYPE=Release -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=OFF -DLLAMA_OPENSSL=OFF -DGGML_NATIVE=OFF
          cmake --build "$RUNNER_TEMP/llama-build" --target llama-quantize llama-tts -j 2

      - name: Download current Q2 backbone and matching BF16 mmproj
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check "huggingface_hub==0.36.0"
          mkdir -p "$RUNNER_TEMP/model"
          python3 - <<'PY'
          import json, os, shutil
          from huggingface_hub import HfApi, hf_hub_download
          repo="prithivMLmods/ZONOS3-Mini-GGUF"
          info=HfApi().model_info(repo)
          files={
              "backbone-q2_k.gguf": ("ZONOS3-Mini.Q2_K.gguf", 299703488),
              "mmproj-bf16.gguf": ("ZONOS3-Mini.mmproj-bf16.gguf", 688971264),
          }
          root=os.path.join(os.environ["RUNNER_TEMP"],"model")
          for out,(name,expected) in files.items():
              src=hf_hub_download(repo_id=repo,filename=name,revision=info.sha)
              assert os.path.getsize(src)==expected,(name,os.path.getsize(src),expected)
              shutil.copyfile(src,os.path.join(root,out))
          json.dump({"repo":repo,"revision":info.sha},open(os.path.join(root,"source.json"),"w"),indent=2)
          print(info.sha)
          PY

      - name: Selectively quantize mmproj and smoke-test Turkish generation
        shell: bash
        run: |
          set -u -o pipefail
          Q="$RUNNER_TEMP/llama-build/bin/llama-quantize"
          T="$RUNNER_TEMP/llama-build/bin/llama-tts"
          M="$RUNNER_TEMP/model"
          : > "$M/valid.txt"

          # conversion/zonos3.py marks these tensors F32 because they are host-read,
          # get_rows inputs, SSM/conv kernels or speaker-encoder conv operands.
          # Generic llama-quantize otherwise changes some of them and libmtmd rejects
          # the resulting mmproj (for example a.gen.wav.mixer.weight).
          SAFE=(
            --tensor-type '^voice\..*=f32'
            --tensor-type '^a\.spk\..*=f32'
            --tensor-type '\.table$=f32'
            --tensor-type '\.dw\.weight$=f32'
            --tensor-type '\.mixer\.weight$=f32'
            --tensor-type '\.resample\.weight$=f32'
          )

          validate_wav() {
            python3 - "$1" <<'PY'
          import sys,wave,array,os
          p=sys.argv[1]
          assert os.path.getsize(p)>1000,p
          with wave.open(p,"rb") as w:
              assert w.getnchannels()==1
              assert w.getframerate()>16000
              assert w.getnframes()>100
              raw=w.readframes(w.getnframes())
          a=array.array("h");a.frombytes(raw)
          assert any(x for x in a),"silent output"
          print("VALID",p,os.path.getsize(p))
          PY
          }

          for spec in q8_0:Q8_0 q4_k_m:Q4_K_M q3_k_m:Q3_K_M q2_k:Q2_K; do
            key="${spec%%:*}"
            type="${spec#*:}"
            out="$M/mmproj-$key.gguf"
            wav="$M/smoke-$key.wav"
            echo "::group::candidate $key"
            if "$Q" "${SAFE[@]}" "$M/mmproj-bf16.gguf" "$out" "$type" &&
               "$T" -m "$M/backbone-q2_k.gguf" -mm "$out" --tts-lang tr -p "Merhaba, bu kısa bir Türkçe ses denemesidir." -n 12 -o "$wav" &&
               validate_wav "$wav"; then
              echo "$key" >> "$M/valid.txt"
              stat -c '%n %s bytes' "$out"
            else
              echo "candidate $key rejected" >&2
              rm -f "$out" "$wav"
            fi
            echo "::endgroup::"
          done

          test -s "$M/valid.txt"
          echo "Working candidates:"
          cat "$M/valid.txt"

      - name: Build SHA-verified external ZIP packages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,shutil,zipfile
          root=os.path.join(os.environ["RUNNER_TEMP"],"model")
          src=json.load(open(os.path.join(root,"source.json")))
          valid={x.strip() for x in open(os.path.join(root,"valid.txt")) if x.strip()}
          variants={
              "q8_0":("Q2_K+Q8_0","mmproj-q8_0.gguf"),
              "q4_k_m":("Q2_K+Q4_K_M","mmproj-q4_k_m.gguf"),
              "q3_k_m":("Q2_K+Q3_K_M","mmproj-q3_k_m.gguf"),
              "q2_k":("Q2_K+Q2_K","mmproj-q2_k.gguf"),
          }
          out=os.path.join(os.environ["RUNNER_TEMP"],"packages");os.makedirs(out,exist_ok=True)
          def sha(p):
              h=hashlib.sha256()
              with open(p,"rb") as f:
                  for b in iter(lambda:f.read(1024*1024),b""):h.update(b)
              return h.hexdigest()
          report=[]
          for quant in ("q8_0","q4_k_m","q3_k_m","q2_k"):
              if quant not in valid: continue
              variant,mm=variants[quant]
              key=variant.replace("+","-").lower()
              d=os.path.join(out,key);os.makedirs(d)
              files={"backbone":"backbone-q2_k.gguf","mmproj":mm}
              manifest={"schema":1,"model_id":"ZONOS3-Mini","variant":variant,"source_repo":src["repo"],"source_revision":src["revision"],"llama_cpp_revision":"e6d624b9a4b95c6b52f5ca384d70b75581f9821a","files":{}}
              for role,name in files.items():
                  source=os.path.join(root,name);dest=os.path.join(d,name);shutil.copyfile(source,dest)
                  manifest["files"][role]={"name":name,"size":os.path.getsize(dest),"sha256":sha(dest)}
              with open(os.path.join(d,"zonos3-package.json"),"w") as f:json.dump(manifest,f,ensure_ascii=False,indent=2)
              zpath=os.path.join(out,"zonos3-mini-android-"+key+".zip")
              with zipfile.ZipFile(zpath,"w",compression=zipfile.ZIP_STORED) as z:
                  for name in ["zonos3-package.json",files["backbone"],files["mmproj"]]: z.write(os.path.join(d,name),name)
              with zipfile.ZipFile(zpath) as z: assert z.testzip() is None
              report.append({"variant":variant,"zip":os.path.basename(zpath),"zip_size":os.path.getsize(zpath),"backbone_size":manifest["files"]["backbone"]["size"],"mmproj_size":manifest["files"]["mmproj"]["size"]})
          assert report
          report.sort(key=lambda x:x["zip_size"])
          with open(os.path.join(out,"report.json"),"w") as f:json.dump(report,f,indent=2)
          print(json.dumps(report,indent=2))
          PY
          ls -lh "$RUNNER_TEMP/packages"/*.zip "$RUNNER_TEMP/packages/report.json"

      - uses: actions/upload-artifact@v4
        with:
          name: zonos3-mini-android-q2-model-zips
          path: |
            ${{ runner.temp }}/packages/*.zip
            ${{ runner.temp }}/packages/report.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
