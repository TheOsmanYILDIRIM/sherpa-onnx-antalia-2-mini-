name: Antalia 1.0.1 - direct Sherpa fork Android ARM64 compact TTS

on:
  push:
    branches:
      - experiment/antalia-android-1.0.1-20261110
    paths:
      - .github/workflows/antalia-android-experiment.yml
      - android/AntaliaMiniTts/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Sherpa-ONNX fork directly (no HayaiTTS)
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download validated 1.0.1 text frontend assets
        uses: actions/download-artifact@v4
        with:
          name: antalia-2-mini-1.0.1-fp32-onnx
          repository: TheOsmanYILDIRIM/sherpa-onnx-antalia-2-mini-
          run-id: 42702032039
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/antalia-onnx

      - name: Download last verified background TTS APK for pinned normalizer
        uses: actions/download-artifact@v4
        with:
          name: antalia-mini-1.0.1-sherpa-fork-arm64-original-split
          repository: TheOsmanYILDIRIM/sherpa-onnx-antalia-2-mini-
          run-id: 42824178440
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/antalia-last-good

      - name: Fetch and validate original four split ONNX graphs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check \
            'huggingface_hub==0.30.2' 'onnxruntime==1.21.0' 'numpy==1.26.4'
          python3 android/AntaliaMiniTts/prepare_models.py \
            "${{ runner.temp }}/antalia-onnx" \
            "android/AntaliaMiniTts/app/src/main/assets/antalia" \
            "${{ runner.temp }}/antalia-last-good/app-debug.apk"

      - name: Stage and smoke-test Clarvia Tiny
        shell: bash
        run: |
          set -euo pipefail
          python3 android/AntaliaMiniTts/prepare_clarvia.py \
            "android/AntaliaMiniTts/app/src/main/assets/clarvia" \
            "android/AntaliaMiniTts/app/src/main/python"
          PYTHONPATH=android/AntaliaMiniTts/app/src/main/python python3 - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          import onnxruntime as ort
          from clarvia_bridge import phonemize_chunks_json

          base=Path("android/AntaliaMiniTts/app/src/main")
          chunks=json.loads(phonemize_chunks_json("Merhaba, bugün deniz oldukça sakin görünüyor."))
          assert chunks and len(chunks[0]["ids"]) == len(chunks[0]["stress"])
          session=ort.InferenceSession(str(base/"assets/clarvia/model.onnx"),
                                       providers=["CPUExecutionProvider"])
          c=chunks[0]
          audio,durations=session.run(None,{
              "tokens":np.asarray([c["ids"]],dtype=np.int64),
              "stress":np.asarray([c["stress"]],dtype=np.int64),
              "voice":np.asarray([2],dtype=np.int64),
              "speed":np.asarray([1.0],dtype=np.float32),
              "pitch_shift":np.asarray([0.0],dtype=np.float32),
              "pitch_range":np.asarray([1.0],dtype=np.float32),
          })
          wave=np.asarray(audio).reshape(-1)
          assert wave.size > 4800 and np.isfinite(wave).all()
          assert np.max(np.abs(wave)) > 1e-4
          print("Clarvia smoke OK:",wave.size/24000,"seconds")
          PY

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="$ANDROID_HOME"
          sdkmanager="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$SDK_ROOT" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Test and compile Antalia code before release signing
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android/AntaliaMiniTts :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon

      - name: Verify packaged Clarvia debug APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          from zipfile import ZipFile
          apk=Path('android/AntaliaMiniTts/app/build/outputs/apk/debug/app-debug.apk')
          assert apk.is_file(), apk
          with ZipFile(apk) as z:
              assert z.testzip() is None
              names=z.namelist()
              meta=json.loads(z.read('assets/clarvia/manifest.json'))
              assert meta['sample_rate']==24000
              assert len(meta['voices'])==10
              assert hashlib.sha256(z.read('assets/clarvia/model.onnx')).hexdigest()==meta['model_sha256']
              assert 'assets/clarvia/config.json' in names
              assert any('chaquopy' in x.lower() for x in names), 'Chaquopy runtime/package missing'
              assert any('libpython3.12.so' in x for x in names), 'Python 3.12 runtime missing'
          assert apk.stat().st_size < 100000000, apk.stat().st_size
          print('Verified Clarvia debug APK', apk, apk.stat().st_size, hashlib.sha256(apk.read_bytes()).hexdigest())
          PY

      - name: Upload Clarvia integration debug APK
        uses: actions/upload-artifact@v4
        with:
          name: antalia-mini-clarvia-arm64-debug
          path: android/AntaliaMiniTts/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Restore stable APK signing identity
        shell: bash
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_STORE_PASSWORD }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          KEYSTORE="${RUNNER_TEMP}/antalia-ci.keystore"
          if [[ -n "${ANDROID_SIGNING_KEY:-}" ]]; then
            test -n "${ANDROID_SIGNING_KEY_ALIAS:-}"
            test -n "${ANDROID_SIGNING_KEY_STORE_PASSWORD:-}"
            printf '%s' "$ANDROID_SIGNING_KEY" | base64 --decode > "$KEYSTORE"
            KEY_ALIAS="$ANDROID_SIGNING_KEY_ALIAS"
            STORE_PASS="$ANDROID_SIGNING_KEY_STORE_PASSWORD"
            KEY_PASS="$ANDROID_SIGNING_KEY_STORE_PASSWORD"
            SOURCE="standard"
          elif [[ -n "${ANDROID_KEYSTORE_B64:-}" ]]; then
            printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
            KEY_ALIAS="ci"
            STORE_PASS="android"
            KEY_PASS="android"
            SOURCE="antalia"
          else
            echo "::error::No stable Android signing secret is configured."
            exit 1
          fi
          chmod 600 "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASS" -alias "$KEY_ALIAS" >/dev/null
          echo "Stable signing source: $SOURCE"
          {
            echo "ANTALIA_KEYSTORE_PATH=$KEYSTORE"
            echo "ANTALIA_KEY_ALIAS=$KEY_ALIAS"
            echo "ANTALIA_KEYSTORE_PASSWORD=$STORE_PASS"
            echo "ANTALIA_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

      - name: Build and test compact ARM64 R8 release APK
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ANTALIA_KEYSTORE_PATH"
          gradle -p android/AntaliaMiniTts :app:testReleaseUnitTest :app:assembleRelease --stacktrace --no-daemon

      - name: Verify ARM64 APK contains Antalia and Clarvia TTS backends
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          from zipfile import ZipFile
          apks=list(Path('android/AntaliaMiniTts/app/build/outputs/apk/release').glob('*.apk'))
          assert len(apks)==1,apks
          apk=apks[0]
          with ZipFile(apk) as z:
              assert z.testzip() is None
              names=z.namelist()
              abis={n.split('/')[1] for n in names if n.startswith('lib/') and len(n.split('/'))>2}
              assert abis=={'arm64-v8a'},abis
              assert any('libonnxruntime.so' in x for x in names)
              assert not any('sherpa' in x.lower() or 'hayai' in x.lower() for x in names)
              libs=[x for x in names if x.startswith('lib/') and x.endswith('.so')]
              assert libs and all(z.getinfo(x).compress_type==8 for x in libs)
              meta=json.loads(z.read('assets/antalia/graph_manifest.json'))
              assert meta['model_version']=='1.0.1'
              assert meta['space_revision']=='2c24b406fedada11bd731a2ec9f4535bfd354f03'
              assert set(meta['sha256'])=={'text.onnx','cond.onnx','flow.onnx','vocoder.fp16.onnx'}
              for name,digest in meta['sha256'].items():
                  assert hashlib.sha256(z.read('assets/antalia/'+name)).hexdigest()==digest,name
              for name in ('normalize.js','vocab.json','foreign_dict.json','foreign_parts.json',
                           'known_words.json','english_i.json'):
                  assert 'assets/antalia/'+name in names,name
              assert 'assets/antalia/decoder.onnx' not in names
              clarvia=json.loads(z.read('assets/clarvia/manifest.json'))
              assert clarvia['sample_rate']==24000
              assert len(clarvia['voices'])==10
              assert hashlib.sha256(z.read('assets/clarvia/model.onnx')).hexdigest()==clarvia['model_sha256']
              assert 'assets/clarvia/config.json' in names
              assert any('chaquopy' in x.lower() for x in names), 'Chaquopy runtime/package missing'
              assert any('libpython3.12.so' in x for x in names), 'Python 3.12 runtime missing'
          assert apk.stat().st_size < 80000000,f'APK exceeds 80 MB: {apk.stat().st_size}'
          print('Verified Antalia + Clarvia ARM64 APK',apk,apk.stat().st_size,
                hashlib.sha256(apk.read_bytes()).hexdigest())
          PY

      - name: Verify release APK signature
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs android/AntaliaMiniTts/app/build/outputs/apk/release/app-release.apk

      - name: Upload compact ARM64 R8 release APK
        uses: actions/upload-artifact@v4
        with:
          name: antalia-mini-1.0.1-arm64-r9-release
          path: android/AntaliaMiniTts/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
