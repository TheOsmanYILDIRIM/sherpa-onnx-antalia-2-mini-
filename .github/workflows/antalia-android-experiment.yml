name: Antalia-2 Mini 1.0.1 Android TTS experiment

on:
  push:
    branches:
      - experiment/antalia-android-1.0.1-20261110
    paths:
      - .github/workflows/antalia-android-experiment.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Sherpa-ONNX fork
        uses: actions/checkout@v4

      - name: Checkout existing Antalia Android integration (pinned)
        uses: actions/checkout@v4
        with:
          repository: TheOsmanYILDIRIM/HayaiTTS
          ref: 74f8cd4534a55d570ce3b2dbfe962e698421205d
          path: hayai-android
          lfs: true

      - name: Download verified 1.0.1 model from our successful conversion
        uses: actions/download-artifact@v4
        with:
          name: antalia-2-mini-1.0.1-fp32-onnx
          repository: TheOsmanYILDIRIM/sherpa-onnx-antalia-2-mini-
          run-id: 42702032039
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/antalia-onnx

      - name: Install and verify Antalia model and original normalizer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import shutil

          source = pathlib.Path('${{ runner.temp }}/antalia-onnx')
          target = pathlib.Path('hayai-android/app/src/main/assets/antalia')
          meta = json.loads((source / 'provenance.json').read_text(encoding='utf-8'))
          assert meta['version'] == '1.0.1'
          assert meta['model_revision'] == '0965f4a5fb578763be8ca2a2bb39421378471cd1'
          assert meta['flow_steps'] == 8 and meta['cfg'] == 2.0
          required = (
              'text_stage.onnx', 'sound_stage.onnx', 'decoder.onnx',
              'foreign_dict.json', 'foreign_parts.json', 'known_words.json', 'english_i.json',
              'config.json', 'vocab.json', 'LICENSE', 'NOTICE',
          )
          target.mkdir(parents=True, exist_ok=True)
          for name in required:
              item = source / name
              assert item.is_file() and item.stat().st_size > 0, name
              expected_sha = meta['sha256'][name]
              actual_sha = hashlib.sha256(item.read_bytes()).hexdigest()
              assert actual_sha == expected_sha, name
              shutil.copy2(item, target / name)
          cfg = json.loads((target / 'config.json').read_text(encoding='utf-8'))
          assert cfg['version'] == '1.0.1'
          assert cfg['sample_rate'] == 48000
          print('Pinned FP32 model and dictionary SHA-256 verified')
          PY
          curl --fail --location --silent --show-error \
            --output hayai-android/app/src/main/assets/antalia/normalize.js \
            https://raw.githubusercontent.com/fr0stb1rd/antalia-mini-web/459585b3bf67db5db5d9ec03d394d9b2c95412f2/normalize.js

      - name: Repair prototype Android WebView normalizer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('hayai-android/app/src/main/java/dev/ahmedmohamed/hayaitts/data/antalia/AntaliaWebNormalizer.kt')
          content = path.read_text(encoding='utf-8')
          anchor = 'val web = WebView(context.applicationContext)'
          assert content.count(anchor) == 1, 'Unexpected normalizer implementation'
          content = content.replace(anchor, anchor + '\n            web.settings.javaScriptEnabled = true')
          path.write_text(content, encoding='utf-8')
          assert content.count('web.settings.javaScriptEnabled = true') == 1
          PY

      - name: Quantize 1.0.1 ONNX weights to per-channel INT8 and verify parity
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install 'onnx==1.17.0' 'onnxruntime==1.21.0' 'numpy==1.26.4'
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import numpy as np
          import onnx
          import onnxruntime as ort
          from onnx import TensorProto, helper, numpy_helper

          source = Path('${{ runner.temp }}/antalia-onnx')
          target = Path('hayai-android/app/src/main/assets/antalia')
          metadata = json.loads((source / 'provenance.json').read_text())
          assert metadata['version'] == '1.0.1'
          stages = ('text_stage', 'sound_stage', 'decoder')
          sessions = {}
          summary = {}
          def convert(src, dst):
              model = onnx.load(str(src))
              assert any(x.domain == '' and x.version >= 13 for x in model.opset_import)
              protected = {x.name for x in model.graph.input}
              kept, added, dq_nodes = [], [], []
              count = 0
              for i, weight in enumerate(model.graph.initializer):
                  if weight.data_type != TensorProto.FLOAT or weight.name in protected:
                      kept.append(weight)
                      continue
                  arr = numpy_helper.to_array(weight)
                  # Preserve critical input, spectral head and final ConvNeXt
                  # block at FP32: phase errors amplify after the inverse STFT.
                  sensitive = src.stem == 'decoder' and any(
                      tag in weight.name for tag in (
                          'inp.', 'head.', 'blocks.0.', 'blocks.1.',
                          'blocks.6.', 'blocks.7.',
                      )
                  )
                  if arr.ndim < 2 or arr.size < 512 or sensitive:
                      kept.append(weight)
                      continue
                  assert np.isfinite(arr).all()
                  scale = np.maximum(np.abs(arr).max(axis=tuple(range(1, arr.ndim))) / 127, 1e-8).astype('float32')
                  q = np.clip(np.rint(arr / scale.reshape((-1,) + (1,) * (arr.ndim-1))), -127, 127).astype('int8')
                  prefix = 'antalia_int8_' + str(i)
                  qname, sname, zname = prefix+'_w', prefix+'_scale', prefix+'_zero'
                  added.extend([
                      numpy_helper.from_array(q, name=qname),
                      numpy_helper.from_array(scale, name=sname),
                      numpy_helper.from_array(np.zeros(len(scale), dtype='int8'), name=zname),
                  ])
                  dq_nodes.append(helper.make_node('DequantizeLinear', [qname,sname,zname],
                                                   [weight.name], name=prefix+'_dq', axis=0))
                  count += arr.size
              assert count > 100000, (src.name, count)
              model.graph.ClearField('initializer')
              model.graph.initializer.extend(kept + added)
              for i, node in enumerate(dq_nodes):
                  model.graph.node.insert(i, node)
              onnx.checker.check_model(model, full_check=True)
              onnx.save(model, str(dst))
              assert dst.stat().st_size < src.stat().st_size * .8, src.name
              return count

          for stage in stages:
              original = source / (stage + '.onnx')
              result = target / (stage + '.onnx')
              assert hashlib.sha256(original.read_bytes()).hexdigest() == metadata['sha256'][original.name]
              count = convert(original, result)
              sessions[stage] = (
                  ort.InferenceSession(str(original), providers=['CPUExecutionProvider']),
                  ort.InferenceSession(str(result), providers=['CPUExecutionProvider']),
              )
              old, new = sessions[stage]
              assert [(x.name,x.type) for x in old.get_inputs()] == [(x.name,x.type) for x in new.get_inputs()]
              assert [(x.name,x.type) for x in old.get_outputs()] == [(x.name,x.type) for x in new.get_outputs()]
              summary[stage] = {
                  'original_bytes': original.stat().st_size,
                  'int8_bytes': result.stat().st_size,
                  'quantized_elements': count,
                  'sha256': hashlib.sha256(result.read_bytes()).hexdigest(),
              }
          rng = np.random.default_rng(20261110)
          data = {
              'text_stage': {
                  'ids': np.array([[1]+[12,13,14,15]*4+[2]],dtype='int64'),
                  'mask': np.ones((1,18),dtype='bool'),
              },
              'sound_stage': {
                  'cond': rng.normal(0,.5,(1,64,192)).astype('float32'),
                  'fmask': np.ones((1,64),dtype='bool'),
                  'noise': rng.normal(0,.6,(1,32,256)).astype('float32'),
              },
          }
          data['decoder'] = {'mel': sessions['sound_stage'][0].run(None,data['sound_stage'])[0]}
          thresholds = {'text_stage': 28., 'sound_stage': 22., 'decoder': 25.}
          for stage in stages:
              expected = sessions[stage][0].run(None,data[stage])
              actual = sessions[stage][1].run(None,data[stage])
              metrics = []
              for x,y in zip(expected,actual):
                  assert x.shape == y.shape and np.isfinite(y).all(), stage
                  x,y = x.astype('float64'),y.astype('float64')
                  signal = np.sqrt(np.mean(x*x))
                  error = np.sqrt(np.mean((x-y)**2))
                  snr = float(20*np.log10(max(signal,1e-8)/max(error,1e-12)))
                  metrics.append(round(snr,2))
              summary[stage]['snr_db'] = metrics
              assert min(metrics) >= thresholds[stage], (stage,metrics)
              print(stage, summary[stage])
          before = sum(v['original_bytes'] for v in summary.values())
          after = sum(v['int8_bytes'] for v in summary.values())
          assert after < before*.65, (before, after)
          (target/'quantization.json').write_text(json.dumps({
              'base':'cloud0day3/antalia-mini',
              'base_revision':metadata['model_revision'],
              'version':'1.0.1',
              'weight_format':'symmetric per-channel INT8 QDQ',
              'model_sizes_before_bytes':before,
              'model_sizes_after_bytes':after,
              'stage_tests':summary,
              'numerical_parity_verified':True,
              'audio_listening_quality_and_device_test_pending':True,
          },indent=2), encoding='utf-8')
          print('INT8 weight conversion verified:',before,'->',after)
          PY

      - name: Configure ARM64-only APK (do not modify HayaiTTS repository)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("hayai-android/app/build.gradle.kts")
          content = path.read_text(encoding="utf-8")
          changes = {
              # ABI splits already filter native libraries. A second ndk abiFilter
              # conflicts with Android Gradle Plugin when both select arm64-v8a.
              chr(10).join(("        ndk {", '            abiFilters += listOf("arm64-v8a", "armeabi-v7a", "x86_64")', "        }", "")):
                  '',
              'include("arm64-v8a", "armeabi-v7a", "x86_64")':
                  'include("arm64-v8a")',
              'isUniversalApk = true':
                  'isUniversalApk = false',
          }
          for old, new in changes.items():
              assert content.count(old) == 1, f"Unexpected Gradle ABI config: {old}"
              content = content.replace(old, new, 1)
          path.write_text(content, encoding="utf-8")
          for new in changes.values():
              if new:
                  assert content.count(new) == 1
          assert "abiFilters +=" not in content, "Overlapping ndk ABI filter remains"
          print("Only arm64-v8a ABI split enabled; removed conflicting ndk filter")
          PY

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android 36 with SDK manager from SDK home
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          sdkmanager="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          if [[ ! -x "$sdkmanager" ]]; then
            echo "::error::No Android SDK command-line tools at $SDK_ROOT"
            exit 1
          fi
          echo "Found sdkmanager at $sdkmanager"
          "$sdkmanager" --sdk_root="$SDK_ROOT" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android unit tests and build debug APK
        working-directory: hayai-android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon

      - name: Verify exactly one ARM64 APK and model assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          from zipfile import ZipFile

          output_dir = Path('hayai-android/app/build/outputs/apk/debug')
          apks = sorted(output_dir.glob('*.apk'))
          assert len(apks) == 1, f"Expected exactly one APK, got: {[p.name for p in apks]}"
          apk = apks[0]
          assert apk.name == 'app-arm64-v8a-debug.apk', apk.name
          with ZipFile(apk) as archive:
              assert archive.testzip() is None, "APK archive integrity failed"
              names = archive.namelist()
              architectures = sorted({
                  name.split('/')[1] for name in names
                  if name.startswith('lib/') and len(name.split('/')) > 2
              })
              assert architectures == ['arm64-v8a'], architectures
              for name in ('text_stage.onnx', 'sound_stage.onnx', 'decoder.onnx',
                           'normalize.js', 'config.json', 'vocab.json', 'quantization.json'):
                  path = 'assets/antalia/' + name
                  assert path in names, f"Missing Antalia asset: {path}"
          sha = hashlib.sha256(apk.read_bytes()).hexdigest()
          print(f'Validated single ARM64 APK: {apk} ({apk.stat().st_size} bytes)')
          print(f'SHA-256: {sha}')
          PY

      - name: Upload ARM64-only experimental APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: antalia-2-mini-1.0.1-android-arm64-int8
          path: hayai-android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 14
