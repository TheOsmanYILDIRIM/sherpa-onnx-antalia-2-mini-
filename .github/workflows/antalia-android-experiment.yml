name: Antalia 1.0.1 - direct Sherpa fork Android ARM64 compact TTS

on:
  push:
    branches:
      - experiment/antalia-android-1.0.1-20261110
    paths:
      - .github/workflows/antalia-android-experiment.yml
      - android/AntaliaMiniTts/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Sherpa-ONNX fork directly (no HayaiTTS)
        uses: actions/checkout@v4

      - name: Download validated 1.0.1 text frontend assets
        uses: actions/download-artifact@v4
        with:
          name: antalia-2-mini-1.0.1-fp32-onnx
          repository: TheOsmanYILDIRIM/sherpa-onnx-antalia-2-mini-
          run-id: 42702032039
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/antalia-onnx

      - name: Fetch and validate original four split ONNX graphs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check \
            'huggingface_hub==0.30.2' 'onnxruntime==1.21.0' 'numpy==1.26.4'
          python3 android/AntaliaMiniTts/prepare_models.py \
            "${{ runner.temp }}/antalia-onnx" \
            "android/AntaliaMiniTts/app/src/main/assets/antalia"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="$ANDROID_HOME"
          sdkmanager="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$SDK_ROOT" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build and test compact ARM64 debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android/AntaliaMiniTts :app:assembleDebug --stacktrace --no-daemon

      - name: Verify ARM64 APK contains exact four-stage original models
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          from zipfile import ZipFile
          apks=list(Path('android/AntaliaMiniTts/app/build/outputs/apk/debug').glob('*.apk'))
          assert len(apks)==1,apks
          apk=apks[0]
          with ZipFile(apk) as z:
              assert z.testzip() is None
              names=z.namelist()
              abis={n.split('/')[1] for n in names if n.startswith('lib/') and len(n.split('/'))>2}
              assert abis=={'arm64-v8a'},abis
              assert any('libonnxruntime.so' in x for x in names)
              assert not any('sherpa' in x.lower() or 'hayai' in x.lower() for x in names)
              libs=[x for x in names if x.startswith('lib/') and x.endswith('.so')]
              assert libs and all(z.getinfo(x).compress_type==8 for x in libs)
              meta=json.loads(z.read('assets/antalia/graph_manifest.json'))
              assert meta['model_version']=='1.0.1'
              assert meta['space_revision']=='2c24b406fedada11bd731a2ec9f4535bfd354f03'
              assert set(meta['sha256'])=={'text.onnx','cond.onnx','flow.onnx','vocoder.fp16.onnx'}
              for name,digest in meta['sha256'].items():
                  assert hashlib.sha256(z.read('assets/antalia/'+name)).hexdigest()==digest,name
              for name in ('normalize.js','vocab.json','foreign_dict.json','foreign_parts.json',
                           'known_words.json','english_i.json'):
                  assert 'assets/antalia/'+name in names,name
              assert 'assets/antalia/decoder.onnx' not in names
          assert apk.stat().st_size < 35000000,f'APK exceeds 35 MB: {apk.stat().st_size}'
          print('Verified original split ARM64 APK',apk,apk.stat().st_size,
                hashlib.sha256(apk.read_bytes()).hexdigest())
          PY

      - name: Upload only the compact ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: antalia-mini-1.0.1-sherpa-fork-arm64-original-split
          path: android/AntaliaMiniTts/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
