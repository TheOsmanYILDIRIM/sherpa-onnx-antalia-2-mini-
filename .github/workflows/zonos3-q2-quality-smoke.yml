name: ZONOS3 Mini Q2 Turkish quality smoke

on:
  push:
    branches:
      - experiment/zonos3-mini-android-q2-20261121
    paths:
      - .github/workflows/zonos3-q2-quality-smoke.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  turkish-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Download verified smallest Q2 model package
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(gh run list             --repo "$GITHUB_REPOSITORY"             --workflow "ZONOS3 Mini Q2 publish smallest model ZIP"             --branch "experiment/zonos3-mini-android-q2-20261121"             --status success             --limit 1             --json databaseId             --jq '.[0].databaseId')"
          test -n "$run_id"
          echo "source_run=$run_id" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/in" "$RUNNER_TEMP/model"
          gh run download "$run_id"             --repo "$GITHUB_REPOSITORY"             --name zonos3-mini-android-q2-q2-smallest-model             --dir "$RUNNER_TEMP/in"
          unzip -q "$RUNNER_TEMP/in/zonos3-mini-android-q2_k-q2_k.zip" -d "$RUNNER_TEMP/model"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"model"
          m=json.loads((root/"zonos3-package.json").read_text())
          assert m["variant"]=="Q2_K+Q2_K"
          for x in m["files"].values():
              p=root/x["name"]
              h=hashlib.sha256()
              with p.open("rb") as f:
                  for b in iter(lambda:f.read(1024*1024),b""): h.update(b)
              assert p.stat().st_size==x["size"] and h.hexdigest()==x["sha256"]
          print(json.dumps({"variant":m["variant"],"backbone":m["files"]["backbone"]["size"],"mmproj":m["files"]["mmproj"]["size"]}))
          PY

      - name: Build pinned llama-tts
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp "$RUNNER_TEMP/llama.cpp"
          git -C "$RUNNER_TEMP/llama.cpp" checkout e6d624b9a4b95c6b52f5ca384d70b75581f9821a
          cmake -S "$RUNNER_TEMP/llama.cpp" -B "$RUNNER_TEMP/llama-build"             -DCMAKE_BUILD_TYPE=Release -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_EXAMPLES=OFF             -DLLAMA_BUILD_SERVER=OFF -DLLAMA_OPENSSL=OFF -DGGML_NATIVE=OFF
          cmake --build "$RUNNER_TEMP/llama-build" --target llama-tts -j 2

      - name: Sweep fixed seeds on longer Turkish Q2 sample
        shell: bash
        run: |
          set -euo pipefail
          M="$RUNNER_TEMP/model"
          O="$RUNNER_TEMP/out"; mkdir -p "$O"
          TEXT="Merhaba. Bu, ZONOS üç Mini modelinin Android için küçültülmüş Q2 denemesidir. Türkçe cümlelerin anlaşılır ve doğal kalıp kalmadığını dinleyerek kontrol ediyoruz."
          for seed in $(seq 1 32); do
            /usr/bin/time -f 'elapsed_s=%e\nmax_rss_kb=%M' -o "$O/time-$seed.txt"               "$RUNNER_TEMP/llama-build/bin/llama-tts"               -m "$M/backbone-q2_k.gguf"               -mm "$M/mmproj-q2_k.gguf"               --tts-lang tr               --tts-voice Savannah_en-American_F_1               --seed "$seed"               -p "$TEXT"               -n 300               -o "$O/turkish-seed-$seed.wav"               >"$O/tts-$seed.log" 2>"$O/stderr-$seed.log"
          done

          python3 - <<'PY'
          import array,json,math,os,wave
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"out"
          rows=[]
          for seed in range(1,33):
              p=root/f"turkish-seed-{seed}.wav"
              with wave.open(str(p),"rb") as w:
                  rate=w.getframerate(); frames=w.getnframes(); channels=w.getnchannels()
                  raw=w.readframes(frames)
              a=array.array("h"); a.frombytes(raw)
              rms=math.sqrt(sum(x*x for x in a)/len(a)) if a else 0
              peak=max((abs(x) for x in a),default=0)
              metrics={}
              for line in (root/f"time-{seed}.txt").read_text().splitlines():
                  if "=" in line:
                      k,v=line.split("=",1); metrics[k]=float(v)
              valid=channels==1 and rate==44100 and frames>100 and rms>20 and peak>100
              rows.append({"seed":seed,"sample_rate":rate,"channels":channels,"frames":frames,
                           "duration_s":frames/rate if rate else 0,"rms_pcm16":rms,"peak_pcm16":peak,
                           "wav_bytes":p.stat().st_size,"valid_signal":valid,**metrics})
          good=[x for x in rows if x["valid_signal"]]
          assert good,rows
          strong=[x for x in good if x["duration_s"]>=1.0 and x["rms_pcm16"]>=100 and x["peak_pcm16"]>=1000]
          pool=strong or good
          best=max(pool,key=lambda x:(x["duration_s"],x["rms_pcm16"]))
          report={"variant":"Q2_K+Q2_K","best_seed":best["seed"],"best":best,"strong_candidates":len(strong),"runs":rows}
          (root/"validation.json").write_text(json.dumps(report,indent=2)+"\n")
          (root/"best-seed.txt").write_text(str(best["seed"])+"\n")
          print(json.dumps(report,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: zonos3-mini-q2-turkish-seed-sweep
          path: |
            ${{ runner.temp }}/out/turkish-seed-*.wav
            ${{ runner.temp }}/out/validation.json
            ${{ runner.temp }}/out/best-seed.txt
            ${{ runner.temp }}/out/time-*.txt
            ${{ runner.temp }}/out/tts-*.log
            ${{ runner.temp }}/out/stderr-*.log
          if-no-files-found: error
          retention-days: 30
